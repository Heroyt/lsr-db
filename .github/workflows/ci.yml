name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: reconnect_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 13376:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LSR_DB_TEST_PORT: '13376'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, mbstring, mysqli, pdo_mysql, pdo_sqlite, redis, simplexml, sqlite3, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: CS
        run: composer cs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage
